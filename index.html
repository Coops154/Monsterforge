<html lang="en">

  <meta name="description" content="Monsterforge Sprint 1 — a tabletop-inspired fantasy card fusion workshop."/>
  <title>Monsterforge — Fusion Workshop · Sprint 1</title>
  <style>
:root {
  --wood:#21150f;--wood-2:#342115;--wood-3:#4d3020;
  --paper:#ead4ab;--paper-hi:#f6e7c8;--paper-deep:#cfac76;

  color-scheme:dark;
}
*{box-sizing:border-box}
html{min-height:100%;scroll-behavior:smooth}
body{margin:0;min-height:100vh;color:#f5e9d5;font-family:var(--body);background:radial-gradient(ellipse at 50% 4%,#65402a 0%,transparent 44%),repeating-linear-gradient(2deg,transparent 0 22px,rgba(3,2,1,.06) 23px 24px,transparent 25px 60px),repeating-linear-gradient(90deg,#2b190f 0 100px,#2e1b12 102px 205px,#26160e 206px 311px);background-color:var(--wood);overflow-x:hidden}
.grain{position:fixed;inset:0;pointer-events:none;z-index:60;opacity:.10;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 190 190' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.62' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.4'/%3E%3C/svg%3E")}
button,input,select,textarea{font:inherit}
button{cursor:pointer} button:disabled{opacity:.48;cursor:not-allowed;filter:grayscale(.4)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid #69b0e5;outline-offset:2px}
.site-header{background:linear-gradient(180deg,#150f0b,#22160f 68%,#3d2616);border-bottom:3px solid #6c4928;box-shadow:0 8px 20px #0b0707aa;display:flex;align-items:center;gap:24px;padding:15px clamp(18px,3vw,52px);position:relative;z-index:2;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:12px;min-width:228px;user-select:none}
.brand-mark{font-family:var(--display);background:linear-gradient(125deg,#c17b36,#7d3021);border:2px solid #ebc588;box-shadow:0 0 0 4px #2c1710,0 2px 18px #c0673744;color:#f9dc9a;width:45px;height:45px;display:grid;place-items:center;font-size:30px;transform:rotate(-5deg)}
.brand-text{font:700 clamp(20px,2vw,28px)/1 var(--display);letter-spacing:1.5px;color:#f0d9aa;text-shadow:0 2px 0 #090504,0 0 8px #b96732aa;white-space:nowrap}

.primary-nav{display:flex;gap:6px;flex:1;justify-content:center;flex-wrap:wrap}

.header-end{display:flex;gap:13px;align-items:center}
.build-badge{font-size:10px;letter-spacing:1.1px;color:#c9a984;border:1px solid #705035;background:#23160e;padding:8px 9px;white-space:nowrap}
.icon-button{display:inline-grid;place-items:center;width:32px;height:32px;font-weight:900;border-radius:50%;color:#e8cf9e;border:1px solid #765131;background:linear-gradient(#65422a,#332014)}
.app-content{width:min(1580px,calc(100% - 40px));margin:26px auto 32px;min-height:65vh}
.site-footer{width:min(1580px,calc(100% - 40px));margin:0 auto 18px;display:flex;justify-content:space-between;gap:10px;font-size:11px;color:#a98a68}
h1,h2,h3,h4,p{margin-top:0}h1,h2,h3,h4{font-family:var(--display)}
h1{font-size:clamp(27px,2.6vw,39px);line-height:1.16;margin-bottom:7px}

h3{font-size:19px;line-height:1.2;margin-bottom:10px}

.eyebrow{font:700 10px/1.4 var(--body);letter-spacing:2px;text-transform:uppercase;color:#b4804b;margin-bottom:7px}
.subheading{color:#e0c8a2;font-size:14px;line-height:1.4;margin-bottom:0}
.page-intro{display:flex;align-items:center;justify-content:space-between;gap:20px;margin:0 0 20px;flex-wrap:wrap}
.page-actions{display:flex;gap:9px;flex-wrap:wrap;align-items:center}
.heading-rule{height:2px;background:linear-gradient(90deg,transparent,#b78e53 12%,#b78e53 88%,transparent);margin:15px 0 22px;opacity:.55}
.wood-panel{background:linear-gradient(155deg,#49301e,#23160f 64%);border:2px solid #79532c;box-shadow:inset 0 0 0 2px #201209,0 12px 26px #1007029c,0 1px 1px #e3b47666;border-radius:6px;position:relative}
.paper{color:var(--ink);background:radial-gradient(ellipse at 65% 15%,rgba(255,250,224,.78),transparent 65%),radial-gradient(ellipse at 4% 100%,rgba(123,74,26,.12),transparent 55%),repeating-linear-gradient(168deg,transparent 0 7px,rgba(114,73,27,.014) 8px 9px),linear-gradient(120deg,#dac397,#f4dfb5 30%,#e7c995 100%);border:3px solid #bd9965;border-radius:4px;box-shadow:inset 0 0 0 2px #f9dfb0,inset 0 0 28px #9b6f3a30,0 4px 12px #11070280;position:relative}

.text-field,.select-field,.number-field,.text-area{background:#f9eacd;color:#392719;border:1px solid #9c7851;border-radius:3px;box-shadow:inset 1px 2px 4px #7a52261f;padding:10px 11px;min-width:0;width:100%;outline-color:#3177a2}
.text-field::placeholder,.text-area::placeholder{color:#9b866d}.text-area{resize:vertical;min-height:90px}
.select-field{padding:9px 10px}.dark-search{background:#201710;color:#f7e6c6;border:1px solid #745539;padding:10px 13px;border-radius:3px;width:100%}.dark-search::placeholder{color:#978167}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:3px;padding:12px 16px;font-size:12px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;text-decoration:none;border:2px solid #6b271e;box-shadow:inset 0 2px 0 #e68167aa,inset 0 -3px 0 #551b14,0 3px 0 #24130c,0 4px 7px #14090780;color:#fff0d2;background:linear-gradient(#b94d36,#862a22 52%,#78231d);text-shadow:0 1px #4d190f;transition:filter .14s,transform .14s}
.btn:hover{filter:brightness(1.12);transform:translateY(-1px)}.btn:active{transform:translateY(1px)}
.btn-paper{background:linear-gradient(#fae4b8,#dbb983);color:#4b311c;text-shadow:none;border:2px solid #987044;box-shadow:inset 0 2px #fff0ca,inset 0 -2px #be945c,0 3px 0 #3a2415,0 4px 7px #180c0780}
.btn-blue{background:linear-gradient(#497da0,#275271 65%,#20425d);border-color:#203a54;box-shadow:inset 0 2px #75b5d2,inset 0 -2px #1e4058,0 3px 0 #1b120c;color:#f9f2e3}
.btn-green{background:linear-gradient(#5e8b62,#315a43);border-color:#284c35;box-shadow:inset 0 2px #91b58f,inset 0 -2px #24452e,0 3px 0 #27150d}
.btn-minor{padding:8px 11px;font-size:11px}.btn-full{width:100%}.btn-quiet{background:transparent;color:inherit;box-shadow:none;text-shadow:none;border:1px solid currentColor;opacity:.83}.btn-quiet:hover{opacity:1}
.tag{display:inline-block;padding:4px 7px;border:1px solid #a58252;border-radius:2px;background:#dfc298;color:#4b321b;font-size:10px;font-weight:700;white-space:nowrap}
.tag.dark{background:#322317;border-color:#765238;color:#e4cfad}.tag.approved{background:#c3ddbd;border-color:#61835b;color:#2b4e33}.tag.experimental{background:#f2d399;border-color:#bd8842;color:#6f4914}
.divider{height:1px;background:linear-gradient(90deg,transparent,#855e3594,transparent);margin:16px 0}
.workshop-grid{display:grid;grid-template-columns:minmax(242px,.93fr) minmax(395px,1.65fr) minmax(265px,.95fr);gap:16px;align-items:stretch}
.library-side{padding:20px 16px;min-height:650px;display:flex;flex-direction:column}
.library-side .panel-title{color:#f8dfb5;border-color:#77502b}

.library-toolbar{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0}
.library-side .category-buttons{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 14px}
.category-button{border:1px solid #785437;background:#281c14;color:#d5be9b;border-radius:2px;padding:8px 9px;font-size:10px;font-weight:700}

.card-browser{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;align-content:start}

.tile-add{position:absolute;top:5px;right:5px;width:19px;height:19px;display:grid;place-items:center;border:1px solid #ffdba4;background:#286643;color:#fff;border-radius:50%;font-weight:900;font-size:15px;box-shadow:0 1px 4px #0009}
.tiny{font-size:11px;line-height:1.4}.empty-state{padding:24px 10px;text-align:center;font-family:var(--display);color:#bf9c70;font-style:italic;font-size:14px;grid-column:1/-1}
.workshop-center{padding:23px clamp(16px,2.6vw,34px);min-height:650px}
.center-heading{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:9px}

.slot-topline{display:flex;justify-content:space-between;gap:10px;align-items:center;margin:23px 0 12px;color:#644a2e;font-size:12px;font-weight:800}

.fusion-connector::before{content:"";height:1px;width:29%;background:#aa8250;position:absolute;top:8px}.fusion-connector span{border:1px solid #aa8250;border-radius:100%;display:grid;place-items:center;width:34px;height:34px;background:#f0d7a7;z-index:1}
.option-section{margin:8px 0 16px}.option-title{font:700 14px var(--display);margin-bottom:10px;color:#44301e}
.choice-grid{display:flex;gap:7px;flex-wrap:wrap}.choice-button{padding:9px 11px;display:flex;align-items:center;justify-content:center;gap:5px;flex:1 0 auto;border:1px solid #a37b4a;border-radius:3px;background:linear-gradient(#f3dab0,#dfbd8d);color:#523a22;font:700 11px var(--body);box-shadow:inset 0 1px #fff0c9}

.workshop-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:22px}

.card-inner{border:2px solid #744924;background:linear-gradient(155deg,#f6e0b5,#dfbe88);border-radius:5px;overflow:hidden;min-height:320px}
.card-art{display:block;width:100%;height:clamp(175px,15vw,218px);object-fit:cover;background:linear-gradient(#2c201a,#886344);border-bottom:5px ridge #91663a}
.card-info{padding:0 9px 10px;text-align:center;color:#2c1d14}
.card-name{font:700 clamp(19px,2vw,24px)/1.1 var(--display);margin:8px 0 6px;overflow-wrap:anywhere}

.card-ability{font:13px/1.32 var(--display);min-height:55px;overflow-wrap:anywhere}

.overview-hero{display:grid;grid-template-columns:minmax(280px,1.4fr) minmax(255px,1fr);gap:20px;margin:0 0 20px}
.hero-main{padding:36px clamp(24px,4vw,50px);min-height:345px;background:linear-gradient(115deg,#f5e4c1fa,#ecd3a5f3 72%,#d9b981dd);position:relative;overflow:hidden}

.hero-cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:24px}
.hero-side{padding:24px;color:#e9d1af}.hero-side h2{color:#f7ddb5}.hero-side .focus-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0 19px}
.metric{border:1px solid #88603d;background:#23160f;padding:12px 7px;text-align:center;color:#efd2a0}.metric strong{display:block;font:700 28px var(--display)}.metric span{display:block;font-size:10px;color:#bc9f79;margin-top:4px}

.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.feature-paper{padding:20px 22px;min-height:180px}.feature-paper .feature-icon{font:31px var(--display);color:#9e5a36}.feature-paper h3{font-size:20px;margin:8px 0}.feature-paper p{color:#755839;font-size:13px}

.modal{border:3px solid #8f6337;background:linear-gradient(#e9d0a4,#f3dfb7);color:#3d2c1d;width:min(650px,calc(100vw - 30px));max-height:90vh;overflow-y:auto;padding:27px clamp(17px,3vw,35px);box-shadow:0 24px 65px #000e,inset 0 0 0 4px #f9e9c5}
.modal::backdrop{background:rgba(12,8,5,.83);backdrop-filter:blur(4px)}
.modal h2{font-size:28px}.modal p{color:#715232;font-size:13px}.modal-top{display:flex;justify-content:space-between;align-items:start;gap:12px}
.modal-close{border:1px solid #9c764c;background:#e3c28a;color:#4c311d;padding:6px 11px;font-weight:900}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.form-row{margin-bottom:13px}.form-row.span2{grid-column:span 2}.modal-footer{display:flex;justify-content:flex-end;gap:10px;margin-top:20px;flex-wrap:wrap}
.note-list{color:#63472e;font-size:13px;line-height:1.7;padding-left:20px}
.emoji-spot{display:inline-block;font-size:22px;margin-right:7px}
.inspiration-strip{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}.hint-pill{border:1px dashed #a8875b;background:#ebcfa0;font-family:var(--display);color:#5c422a;padding:5px 9px;font-size:11px;border-radius:15px}
.forge-anim .card-big{animation:forgeGlow .7s ease-out}@keyframes forgeGlow{0%{filter:brightness(2.3);transform:scale(.94)}60%{filter:brightness(1.4);transform:scale(1.02)}100%{filter:brightness(1);transform:scale(1)}}

  <script>
/* Monsterforge — functional, dependency-free, offline Sprint 1 workshop. */
(() => {
  'use strict';
  const STORE = 'monsterforge.sprint1.v1';
  const TYPES = ['Creature','Spell','Item','Equipment','Structure'];
  const ROLES = ['Attack','Defence','Support','Economy','Utility'];
  const TYPE_ICON = {Creature:'♞',Spell:'✧',Item:'◆',Equipment:'⚔',Structure:'♜',Any:'✦'};
  const ROLE_ICON = {Attack:'⚔',Defence:'⬟',Support:'✥',Economy:'◈',Utility:'✣',Any:'✦'};
  const seed = window.MonsterforgeSeed;
  if (!seed) { document.getElementById('app').textContent = 'Card database unavailable. Reopen the complete downloaded folder.';return; }
  const seedCardIds = new Set(seed.cards.map(c=>c.id));
  const seedRecipeIds = new Set(seed.recipes.map(r=>r.id));
  const validArt = new Set(seed.cards.map(c=>c.art));
  const state = {
    page:'workshop',ingredients:[],type:'Any',role:'Any',
    sideSearch:'',sideFilter:'All',fullSearch:'',fullFilter:'All',
    recipeSearch:'',recipeFilter:'All',
    explicitResult:null,customCards:[],customRecipes:[],recent:[]
  };
  let toastTimer;
  try {
    const old=JSON.parse(localStorage.getItem(STORE) || '{}');
    if(Array.isArray(old.customCards))state.customCards=old.customCards.filter(c=>validCard(c)&&!seedCardIds.has(c.id));
    if(Array.isArray(old.customRecipes))state.customRecipes=old.customRecipes.filter(r=>validRecipe(r)&&!seedRecipeIds.has(r.id));
    if(Array.isArray(old.recent))state.recent=old.recent.filter(x=>typeof x === 'string').slice(0,10);
  }catch(_err){}
  const app=document.getElementById('app');
  const modal=document.getElementById('modal');
  const modalInner=document.getElementById('modal-inner');
  const importInput=document.getElementById('import-input');

  function validCard(c){return c&&typeof c.id==='string'&&typeof c.name==='string'&&TYPES.includes(c.type)&&ROLES.includes(c.role)&&['attack','defence','supply'].every(k=>Number.isFinite(c[k]));}
  function validRecipe(r){return r&&typeof r.id==='string'&&typeof r.resultId==='string'&&Array.isArray(r.ingredients)&&r.ingredients.length>=2&&r.ingredients.length<=5&&r.ingredients.every(x=>typeof x==='string');}
  function save(){
    try{localStorage.setItem(STORE,JSON.stringify({customCards:state.customCards,customRecipes:state.customRecipes,recent:state.recent}));}
    catch(_err){notice('Browser storage is unavailable. Use Export JSON to keep your creations.');}
  }
  const cards=()=>[...seed.cards,...state.customCards];
  const recipes=()=>[...seed.recipes,...state.customRecipes];
  const getCard=id=>cards().find(c=>c.id===id);
  const h=value=>String(value??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const artUrl=c=>{
    const name=validArt.has(c?.art)?c.art:'crystal';

pan2"><span class="field-label">Tags (comma separated)</span><input class="text-field" name="tags" maxlength="150" placeholder="e.g. Chimera, Fire, Brute"/></label></div><div class="callout" style="margin:10px 0">Sprint 1 uses existing illustrations as temporary card art. New artwork generation and full editing are planned for Sprint 2.</div><div class="modal-footer"><button class="btn btn-paper" type="button" data-action="close-modal">Cancel</button><button class="btn" type="submit">✦ Save Experimental Card</button></div></form>`);

  function makeCard(form){

    if(!TYPES.includes(type)||!ROLES.includes(role))return;
    const numbers={};for(const k of ['attack','defence','supply']){const v=Number(fd.get(k));if(!Number.isInteger(v)||v<0||v>20){notice('Attack, Defence and Supply must be whole numbers from 0 to 20.');return;}numbers[k]=v;}

  function importJSON(file){
    if(!file)return;

    reader.onload=()=>{
      try{
        const data=JSON.parse(String(reader.result));
        if(data?.format!=='monsterforge-card-catalogue'||!Array.isArray(data.cards)||!Array.isArray(data.recipes))throw new Error('Not a Monsterforge catalogue.');
        if(data.cards.length>2500||data.recipes.length>2500)throw new Error('Catalogue exceeds the prototype limit.');
        const customCards=data.cards.filter(c=>validCard(c)&&!seedCardIds.has(c.id)).map(c=>({...c,art:validArt.has(c.art)?c.art:'crystal',description:String(c.description||'').slice(0,350),tags:Array.isArray(c.tags)?c.tags.slice(0,8).map(String):[],status:c.status==='approved'?'approved':'experimental'}));
        const ids=new Set([...seedCardIds,...customCards.map(c=>c.id)]);
        const customRecipes=data.recipes.filter(r=>validRecipe(r)&&!seedRecipeIds.has(r.id)&&ids.has(r.resultId)&&r.ingredients.every(id=>ids.has(id))).map(r=>({...r,status:r.status==='approved'?'approved':'experimental'}));
        if(!confirm(`Import ${customCards.length} custom cards and ${customRecipes.length} custom recipes? This replaces creations saved in this browser. The built-in cards remain unchanged.`))return;
        state.customCards=customCards;state.customRecipes=customRecipes;state.recent=Array.isArray(data.recent)?data.recent.filter(x=>ids.has(x)).slice(0,10):[];
        state.ingredients=[];state.explicitResult=null;save();render();notice('Catalogue imported. Your card and recipe records are ready.');
      }catch(err){notice('Import failed: '+(err?.message||'invalid file'));}
    };reader.readAsText(file);importInput.value='';
  }
  function help(){openModal(`<div class="modal-top"><div><div class="eyebrow">Old Hearth Workshop · Field Guide</div><h2 id="modal-title">How to Use Monsterforge</h2></div><button class="modal-close" data-action="close-modal" aria-label="Close">✕</button></div><ol class="note-list"><li>Choose <strong>2–5 cards</strong> from the library. Tap the same card more than once to use duplicates.</li><li>Mix <strong>any types</strong>: creatures, spells, items, equipment or structures.</li><li>If an exact recipe exists, its named result appears on the right. Ingredient order does not matter.</li><li>Click <strong>Forge This Fusion</strong> to record the concept or <strong>Manual Create</strong> to invent a new experimental card.</li><li>Approve an experimental recipe when no other approved recipe uses the same ingredients.</li><li>Use <strong>Export JSON</strong> to back up the full catalogue. Data otherwise autosaves to this browser.</li></ol><div class="callout"><strong>Scope:</strong> Sprint 1 is a card authoring tool, not the playable settlement-defence game. AI discovery, artwork generation, deep editing and graphical recipe trees are later sprints.</div><div class="modal-footer"><button class="btn" data-action="close-modal">Begin Experimenting</button></div>`);}

  document.addEventListener('click',event=>{
    const el=event.target.closest('button[data-action],button[data-page]');if(!el)return;
    if(el.dataset.page){navigate(el.dataset.page);return;}
    const action=el.dataset.action;
    switch(action){
      case 'add':addToBench(el.dataset.id,el.dataset.fromLibrary==='true');break;
      case 'remove':setBench(state.ingredients.filter((_,i)=>i!==Number(el.dataset.index)));break;
      case 'clear':setBench([]);notice('The Fusion Bench has been cleared.');break;
      case 'set-type':state.type=el.dataset.value;render();break;
      case 'set-role':state.role=el.dataset.value;render();break;
      case 'side-filter':state.sideFilter=el.dataset.value;render();break;
      case 'full-filter':state.fullFilter=el.dataset.value;render();break;
      case 'recipe-filter':state.recipeFilter=el.dataset.value;render();break;
      case 'try':tryRecipe(el.dataset.value);break;
      case 'use-recipe':{const r=recipes().find(x=>x.id===el.dataset.id);if(r){state.ingredients=[...r.ingredients];state.explicitResult={id:r.resultId,signature:sig(r.ingredients)};navigate('workshop');}break;}
      case 'check':{const r=chosenRecipe();notice(r?`Exact recipe discovered: ${getCard(r.resultId)?.name}.`:'No known recipe. Try Manual Create to invent the result.');break;}
      case 'manual':openManual();break;
      case 'approve':approve();break;
      case 'forge':forge();break;
      case 'export':exportJSON();break;
      case 'import':importInput.click();break;
      case 'close-modal':closeModal();break;
      case 'help':help();break;
    }
  });
  function handleSearchInput(e){
    if(e.target.id==='side-search'){
      state.sideSearch=e.target.value;
      const grid=document.getElementById('side-cards');if(grid)grid.innerHTML=getSideTiles();
      const count=document.getElementById('side-count');if(count)count.textContent=filterCards(state.sideSearch,state.sideFilter).length;
    }else if(e.target.id==='full-search'){
      state.fullSearch=e.target.value;const grid=document.getElementById('full-cards');if(grid)grid.innerHTML=getFullTiles();
      const count=document.querySelector('.library-top h2');if(count)count.textContent=`${filterCards(state.fullSearch,state.fullFilter).length} Cards in View`;
    }else if(e.target.id==='recipe-search'){
      state.recipeSearch=e.target.value;
      // Redraw only the results, keeping text focus and cursor position.
      const temp=document.createElement('div');temp.innerHTML=renderRecipes();const target=document.getElementById('recipe-list');
      if(target)target.innerHTML=temp.querySelector('#recipe-list')?.innerHTML||'';
    }
  }
  document.addEventListener('input',handleSearchInput);
  document.addEventListener('submit',event=>{if(event.target.id==='create-card-form'){event.preventDefault();makeCard(event.target);}});
  importInput.addEventListener('change',event=>importJSON(event.target.files?.[0]));
  modal.addEventListener('click',event=>{if(event.target===modal)closeModal();});
  render();
})();

</script>
</body>
</html>
